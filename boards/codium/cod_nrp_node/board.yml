board:
  name: cod_nrp_node
  full_name: Codium NR+ node
  vendor: codium
  socs:
  - name: nrf9151
    variants:
    - name: 'ns'
  - name: nrf54l15
    variants:
      - name: 'ns'
        cpucluster: cpuapp
  revision:
    format: major.minor.patch
    default: "1.0.0"
    revisions:
    - name: "1.0.0"
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - cod_nrp_node/nrf9151
              - cod_nrp_node/nrf9151/ns
              - cod_nrp_node/nrf54l15/cpuapp
              - cod_nrp_node/nrf54l15/cpuapp/ns
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - cod_nrp_node/nrf9151
              - cod_nrp_node/nrf9151/ns
              - cod_nrp_node/nrf54l15/cpuapp
              - cod_nrp_node/nrf54l15/cpuapp/ns
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - cod_nrp_node/nrf9151
              - cod_nrp_node/nrf9151/ns
              - cod_nrp_node/nrf54l15/cpuapp
              - cod_nrp_node/nrf54l15/cpuapp/ns
